name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

  chromium-smoke:
    name: Chromium smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: ${{ hashFiles('tests/ui/**/*.spec.ts', '!tests/ui/**/*.a11y.spec.ts', '!tests/ui/**/*.visual.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run Chromium smoke tests
        if: ${{ hashFiles('tests/ui/**/*.spec.ts', '!tests/ui/**/*.a11y.spec.ts', '!tests/ui/**/*.visual.spec.ts') != '' }}
        run: npm run test:smoke

      - name: Report scaffold-only state
        if: ${{ hashFiles('tests/ui/**/*.spec.ts', '!tests/ui/**/*.a11y.spec.ts', '!tests/ui/**/*.visual.spec.ts') == '' }}
        run: echo "UI smoke tests have not been implemented yet."

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-smoke-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deterministic-api:
    name: Deterministic API checks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        if: ${{ hashFiles('tests/api/**/*.spec.ts') != '' }}
        run: npm run test:api

      - name: Report scaffold-only state
        if: ${{ hashFiles('tests/api/**/*.spec.ts') == '' }}
        run: echo "API tests have not been implemented yet."

      - name: Upload API artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deterministic-api-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  high-risk-accessibility:
    name: High-risk accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        if: ${{ hashFiles('tests/ui/**/*.a11y.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run high-risk accessibility tests
        if: ${{ hashFiles('tests/ui/**/*.a11y.spec.ts') != '' }}
        run: npm run test:a11y:high-risk

      - name: Report scaffold-only state
        if: ${{ hashFiles('tests/ui/**/*.a11y.spec.ts') == '' }}
        run: echo "Accessibility tests have not been implemented yet."

      - name: Upload accessibility artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: high-risk-accessibility-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
